<!-- web/templates/base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {{block "styles" .}}{{end}}
</head>
<body>
    <!-- Боковая панель -->
    {{template "sidebar.html" .}}

    <!-- Основной контент -->
    <main class="main-content">
        {{block "content" .}}{{end}}
    </main>

    {{block "scripts" .}}{{end}}
</body>
</html>
