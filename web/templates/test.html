<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Минимум</title>
</head>
<body>

  <button id="loadBtn">Загрузить</button>
  <button id="addBtn">Добавить</button>
  <p id="status"></p>
  <ul id="list"></ul>

  <script>
    const API = 'https://jsonplaceholder.typicode.com/users';

    // GET
    async function load() {
      status.textContent = 'Загрузка...';
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error(res.status);
        const users = await res.json();
        list.innerHTML = '';
        users.forEach(u => {
          list.innerHTML += `<li>${u.id}. ${u.name}</li>`;
        });
        status.textContent = 'Готово: ' + users.length;
      } catch (e) {
        status.textContent = 'Ошибка: ' + e.message;
      }
    }

    // POST
    async function add() {
      status.textContent = 'Отправка...';
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'Иван', age: 30 })
        });
        if (!res.ok) throw new Error(res.status);
        const user = await res.json();
        status.textContent = 'Создан: ' + user.name + ' (id=' + user.id + ')';
      } catch (e) {
        status.textContent = 'Ошибка: ' + e.message;
      }
    }

    loadBtn.onclick = load;
    addBtn.onclick = add;
  </script>

</body>
</html>
