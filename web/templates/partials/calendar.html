{{ define "vacation_picker" }}
<fieldset class="vacation-type">
    <legend>Вид отпуска</legend>
    <label><input type="radio" name="vacation-type" value="annual" checked> Ежегодный оплачиваемый</label>
    <label><input type="radio" name="vacation-type" value="unpaid"> Без сохранения заработной платы (административный)</label>
    <p class="muted vacation-type__hint" data-for="unpaid" hidden>
        Квоту не расходует. Вступает в силу после утверждения администратором; дни сверх 14 за рабочий год сдвигают рабочий год.
    </p>
</fieldset>

<div id="calendar" class="calendar"
     data-user-id="{{ .Cmd.UserID }}"
     data-year="{{ .Year }}"
     data-is-admin="{{ .IsAdmin }}">
    <p class="muted">Загрузка…</p>
</div>

<h2>Выбранные периоды</h2>
<div id="selected-periods" class="periods">
    <p class="muted">Пока ничего не выбрано</p>
</div>

<div id="allocation" class="allocation"></div>

<button id="confirm-btn" type="button" disabled>Подтвердить</button>
{{ end }}
