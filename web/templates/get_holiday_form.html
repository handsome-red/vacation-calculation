<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Создать новый праздник</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>Создать новый праздник</h1>

    <p><a href="/admin/holidays">← К списку</a></p>

    {{if .Errors}}
    <ul style="color:#b00">
        {{range .Errors}}<li>{{.}}</li>{{end}}
    </ul>
    {{end}}

    <form method="POST" action="/admin/holidays">
        <p>
            <label for="date">Дата праздника</label><br>
            <input type="date" id="date" name="date"
                   value="{{.Form.Date}}" required>
        </p>

        <p>
            <label for="name">Название</label><br>
            <input type="text" id="name" name="name"
                   value="{{.Form.Name}}" maxlength="200" required>
        </p>

        <p>
            <button type="submit">Создать</button>
            <a href="/admin/holidays">Отмена</a>
        </p>
    </form>
</body>
</html>
