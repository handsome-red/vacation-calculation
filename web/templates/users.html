<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Users</title>
</head>
<body>
    <table>
    <thead>
        <tr>
        <th>ID</th>
        <th>Email</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Middle Name</th>
        <th>Department</th>
        <th>Is Active</th>
        <th>Created At</th>
        <th>Updated At</th>
        </tr>
    </thead>
    <tbody>
        {{range .Users}}
        <tr>
        <td>{{.ID}}</td>
        <td>{{.Email}}</td>
        <td>{{.FirstName}}</td>
        <td>{{.LastName}}</td>
        <td>{{.MiddleName}}</td>
        <td>{{.Department}}</td>
        <td>{{.IsActive}}</td>
        <td>{{.CreatedAt}}</td>
        <td>{{.UpdatedAt}}</td>
        </tr>
        {{end}}
    </tbody>
    </table>
</body>
</html>
