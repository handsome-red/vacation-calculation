{{ define "title" }}Создать отпуск{{ end }}

{{ define "content" }}
<h1>Создать отпуск</h1>

{{ if .Errors }}
<ul style="color:#b00">
    {{ range .Errors }}<li>{{ . }}</li>{{ end }}
</ul>
{{ end }}

<form method="POST" action="/api/v1/users/{{ .Cmd.UserID }}/vacations">
    <input type="hidden" name="user_id" value="{{ .Cmd.UserID }}">

    {{ template "calendar" .Calendar }}

    <p>
        <button type="submit">Создать</button>
    </p>
</form>
{{ end }}
