{{define "title"}}Новый день календаря{{end}}

{{define "content"}}
<div class="container">
    <h1>Добавить день в производственный календарь</h1>

    <p><a href="/calendar">← К календарю</a></p>

    {{if .Errors}}
    <ul style="color:#b00">
        {{range .Errors}}<li>{{.}}</li>{{end}}
    </ul>
    {{end}}

    <form method="POST" action="/admin/holidays">
        <p>
            <label for="date">Дата</label><br>
            <input type="date" id="date" name="date" value="{{.Form.Date}}" required>
        </p>

        <p>
            <label for="day_type">Тип дня</label><br>
            <select id="day_type" name="day_type" required>
                <option value="holiday" {{if eq .Form.Type "holiday"}}selected{{end}}>Праздничный (нерабочий) день</option>
                <option value="working" {{if eq .Form.Type "working"}}selected{{end}}>Рабочий выходной</option>
            </select>
        </p>

        <p>
            <label for="name">Название</label><br>
            <input type="text" id="name" name="name" value="{{.Form.Name}}" maxlength="200" required>
        </p>

        <p>
            <button type="submit">Сохранить</button>
            <a href="/calendar">Отмена</a>
        </p>
    </form>
</div>
{{end}}
